<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Umut Ambalaj</title>

<style>
body{
  font-family:Arial,sans-serif;
  margin:0;
  background:#f4f6f8;
}
header{
  background:#1565c0;
  color:white;
  padding:20px;
  text-align:center;
}
.container{
  padding:15px;
  max-width:700px;
  margin:auto;
}
button{
  width:100%;
  padding:15px;
  margin:6px 0;
  border:0;
  border-radius:8px;
  background:#1565c0;
  color:white;
  font-size:17px;
}
.card{
  background:white;
  padding:15px;
  margin-top:12px;
  border-radius:10px;
}
input,select,textarea{
  width:100%;
  padding:12px;
  margin:6px 0;
  box-sizing:border-box;
  font-size:16px;
}
.hidden{display:none;}
.musteri{
  border-bottom:1px solid #ddd;
  padding:10px 0;
}
</style>
</head>

<body>

<header>
<h1>UMUT AMBALAJ</h1>
<div>Sipariş ve Müşteri Takip Sistemi</div>
</header>

<div class="container">

<div id="ana">
<button>🚚 Yarın Teslim Edilecekler</button>
<button onclick="musterileriAc()">👥 Müşteriler</button>
<button onclick="siparisleriAc()">📦 Siparişler</button>
<button>💰 Cari / Tahsilat</button>
<button>📊 Ciro ve Kâr</button>

<div class="card">
Bandırma • Erdek • Gönen • Manyas • Edincik • Avşa Adası • Ocaklar
</div>
</div>

<div id="musteriler" class="hidden">

<button onclick="anaSayfa()">⬅ Ana Sayfa</button>

<div class="card">
<h2>👥 Yeni Müşteri</h2>

<input id="ad" placeholder="Müşteri adı">

<select id="bolge">
<option value="">Bölge seçin</option>
<option>Bandırma</option>
<option>Erdek</option>
<option>Gönen</option>
<option>Manyas</option>
<option>Edincik</option>
<option>Avşa Adası</option>
<option>Ocaklar</option>
</select>

<input id="telefon" type="tel" placeholder="Telefon">
<textarea id="adres" placeholder="Adres"></textarea>

<button onclick="musteriKaydet()">💾 Müşteriyi Kaydet</button>
</div>

<div class="card">
<h2>Müşteri Listesi</h2>
<div id="liste"></div>
</div>

</div>
</div>
<div id="siparisler" class="hidden">

  <button onclick="anaSayfa()">← Ana Sayfa</button>

  <div class="card">
    <h2>📦 Yeni Sipariş</h2>

    <select id="sipMusteri">
      <option value="">Müşteri seçin</option>
    </select>

    <input id="sipUrun" placeholder="Ürün adı">

    <input id="sipMiktar" type="number" placeholder="Miktar">

    <input id="sipFiyat" type="number" step="0.01" placeholder="Birim fiyat ₺">

    <input id="sipTarih" type="date">

    <button onclick="siparisKaydet()">💾 Siparişi Kaydet</button>
  </div>

  <div class="card">
    <h2>📅 İleri Tarihli Siparişler</h2>
    <div id="siparisListesi"></div>
  </div>

</div>
<script>
let musteriler = JSON.parse(localStorage.getItem("musteriler")) || [];

function musterileriAc(){
  document.getElementById("ana").classList.add("hidden");
  document.getElementById("musteriler").classList.remove("hidden");
  listele();
}

function anaSayfa(){
    document.getElementById("musteriler").classList.add("hidden");
    document.getElementById("siparisler").classList.add("hidden");
    document.getElementById("ana").classList.remove("hidden");
}


function musteriKaydet(){
  let ad=document.getElementById("ad").value.trim();
  let bolge=document.getElementById("bolge").value;
  let telefon=document.getElementById("telefon").value.trim();
  let adres=document.getElementById("adres").value.trim();

  if(ad==="" || bolge===""){
    alert("Müşteri adı ve bölge zorunludur.");
    return;
  }

  musteriler.push({
    ad:ad,
    bolge:bolge,
    telefon:telefon,
    adres:adres
  });

  localStorage.setItem("musteriler",JSON.stringify(musteriler));

  document.getElementById("ad").value="";
  document.getElementById("bolge").value="";
  document.getElementById("telefon").value="";
  document.getElementById("adres").value="";

  listele();
  alert("Müşteri kaydedildi.");
}

function listele(){
    let alan = document.getElementById("liste");
    alan.innerHTML = "";

    musteriler.forEach(function(m, index){
        alan.innerHTML +=
        '<div class="musteri">' +
        '<b>' + m.ad + '</b><br>' +
        m.bolge + '<br>' +
        m.telefon + '<br>' +
        m.adres + '<br>' +
        '<button onclick="musteriSil(' + index + ')">🗑️ Müşteriyi Sil</button>' +
        '</div>';
    });
}

function musteriSil(index){
    if(confirm("Bu müşteriyi silmek istiyor musunuz?")){
        musteriler.splice(index, 1);
        localStorage.setItem("musteriler", JSON.stringify(musteriler));
        listele();
    }
}
listele();
let siparisler = JSON.parse(localStorage.getItem("siparisler") || "[]");

function siparisleriAc(){
    document.getElementById("ana").classList.add("hidden");
    document.getElementById("musteriler").classList.add("hidden");
    document.getElementById("siparisler").classList.remove("hidden");

    let secim = document.getElementById("sipMusteri");
    secim.innerHTML = '<option value="">Müşteri seçin</option>';

    musteriler.forEach(function(m){
        secim.innerHTML += '<option value="' + m.ad + '">' + m.ad + '</option>';
    });

    siparisListele();
}

function siparisKaydet(){
    let musteri = document.getElementById("sipMusteri").value;
    let urun = document.getElementById("sipUrun").value.trim();
    let miktar = document.getElementById("sipMiktar").value;
    let fiyat = document.getElementById("sipFiyat").value;
    let tarih = document.getElementById("sipTarih").value;

    if(musteri==="" || urun==="" || tarih===""){
        alert("Müşteri, ürün ve tarih zorunludur.");
        return;
    }

    siparisler.push({
        musteri:musteri,
        urun:urun,
        miktar:miktar,
        fiyat:fiyat,
        tarih:tarih
    });

    localStorage.setItem("siparisler", JSON.stringify(siparisler));

    document.getElementById("sipUrun").value="";
    document.getElementById("sipMiktar").value="";
    document.getElementById("sipFiyat").value="";
    document.getElementById("sipTarih").value="";

    siparisListele();
    alert("Sipariş kaydedildi.");
}

function siparisListele(){
    let alan = document.getElementById("siparisListesi");
    alan.innerHTML = "";

    let sirali = siparisler.slice().sort(function(a,b){
        return a.tarih.localeCompare(b.tarih);
    });

    sirali.forEach(function(s){
        alan.innerHTML +=
            '<div class="musteri">' +
            '<b>' + s.musteri + '</b><br>' +
            '📦 ' + s.urun + '<br>' +
            'Miktar: ' + s.miktar + '<br>' +
            'Fiyat: ' + s.fiyat + ' ₺<br>' +
            '📅 ' + s.tarih +
            '</div>';
    });
  }
function sonFiyatiGetir(){
    let musteri = document.getElementById("sipMusteri").value;
    let urun = document.getElementById("sipUrun").value.trim().toLowerCase();

    if(musteri === "" || urun === "") return;

    for(let i = siparisler.length - 1; i >= 0; i--){
        if(
            siparisler[i].musteri === musteri &&
            siparisler[i].urun.toLowerCase() === urun
        ){
            document.getElementById("sipFiyat").value = siparisler[i].fiyat;
            return;
        }
    }
}

document.getElementById("sipUrun").addEventListener("change", sonFiyatiGetir);
document.getElementById("sipMusteri").addEventListener("change", sonFiyatiGetir);
</script>
</body>
</html>
