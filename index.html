<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Umut Ambalaj</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f3f5f7;color:#17202a}header{background:#17324d;color:#fff;padding:18px 14px;text-align:center;font-size:22px;font-weight:700}.wrap{max-width:760px;margin:auto;padding:12px}.nav{display:grid;grid-template-columns:1fr 1fr;gap:9px}.nav button,.btn{border:0;border-radius:10px;padding:13px 10px;font-weight:700;font-size:15px;background:#fff;box-shadow:0 1px 5px #ccd2d8;color:#17324d}.btn.primary{background:#17324d;color:#fff}.btn.red{background:#b3261e;color:#fff}.btn.green{background:#18794e;color:#fff}.btn.small{padding:8px;font-size:13px}.page{display:none}.card{background:#fff;border-radius:12px;padding:13px;margin:10px 0;box-shadow:0 1px 5px #d8dde2}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.three{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}input,select{width:100%;padding:11px;border:1px solid #cbd2d9;border-radius:8px;font-size:16px;margin:5px 0 9px;background:#fff}label{font-size:13px;font-weight:700;color:#46515c}.title{font-size:20px;font-weight:700;margin:5px 0 12px}.muted{color:#66727e;font-size:13px}.money{font-weight:700}.item{border-top:1px solid #e4e8eb;padding:10px 0}.item:first-child{border-top:0}.right{text-align:right}.pill{display:inline-block;padding:5px 8px;border-radius:20px;background:#edf1f4;font-size:12px;margin:2px}.filters{display:flex;gap:6px;overflow:auto;padding-bottom:5px}.filters button{white-space:nowrap}.active{background:#17324d!important;color:#fff!important}.danger{color:#b3261e}.ok{color:#18794e}.warn{color:#9a6700}.summary{font-size:17px;line-height:1.8}.back{margin-bottom:8px}@media(max-width:480px){.three{grid-template-columns:1fr}.row{grid-template-columns:1fr}.nav{grid-template-columns:1fr 1fr}}
</style>
</head><body>
<header>UMUT AMBALAJ</header><div class="wrap">
<div id="home" class="page">
 <div class="nav">
  <button onclick="openDeliveries()">🚚 Teslim Edilecekler</button><button onclick="openCustomers()">👥 Müşteriler</button>
  <button onclick="openOrders()">📦 Siparişler</button><button onclick="openProducts()">🏷️ Ürünler</button>
  <button onclick="openCurrent()">💰 Cari / Tahsilat</button><button onclick="openProfit()">📊 Ciro ve Kâr</button>
  <button onclick="openRegions()">📍 Bölge Bakiyeleri</button>
 </div>
</div>
<div id="customers" class="page"><button class="btn back" onclick="goHome()">← Ana Sayfa</button><div class="title">Müşteriler</div><div class="card"><label>Müşteri adı</label><input id="cName"><label>Bölge</label><select id="cRegion"></select><button class="btn primary" onclick="addCustomer()">Müşteri Ekle</button></div><div id="customerList"></div></div>
<div id="products" class="page"><button class="btn back" onclick="goHome()">← Ana Sayfa</button><div class="title">Ürünler</div><div class="card"><label>🔍 Ürün Ara</label><input id="pSearch" oninput="listProducts()" placeholder="Ürün adı"><hr><label>Ürün adı</label><input id="pName"><div class="row"><div><label>Maliyet ₺</label><input id="pCost" type="number" step="0.01"></div><div><label>Satış ₺</label><input id="pSale" type="number" step="0.01"></div></div><button class="btn primary" onclick="addProduct()">Ürün Ekle</button></div><div id="productList"></div></div>
<div id="orders" class="page"><button class="btn back" onclick="goHome()">← Ana Sayfa</button><div class="title" id="orderTitle">Yeni Sipariş</div><div class="card"><label>Müşteri</label><select id="oCustomer" onchange="orderBalance();renderBasket()"></select><div id="orderBalanceBox" class="summary"></div><label>Teslim tarihi</label><input id="oDate" type="date"><hr><label>Ürün</label><select id="oProduct" onchange="fillProductPrice()"></select><div class="row"><div><label>Adet</label><input id="oQty" type="number" step="0.01" value="1" oninput="renderBasket()"></div><div><label>Fiyat ₺</label><input id="oPrice" type="number" step="0.01" oninput="renderBasket()"></div></div><button class="btn" onclick="addBasket()">+ Ürünü Sepete Ekle</button><div id="basketList"></div><button id="orderSave" class="btn primary" onclick="saveOrder()">Siparişi Kaydet</button> <button id="cancelEdit" class="btn" style="display:none" onclick="cancelOrderEdit()">Vazgeç</button></div><div class="title">Kayıtlı Siparişler</div><div id="orderList"></div></div>
<div id="deliveries" class="page"><button class="btn back" onclick="goHome()">← Ana Sayfa</button><div class="title">Teslim Edilecekler</div><div id="deliveryFilters" class="filters"></div><div id="deliverySummary" class="card"></div><div id="deliveryList"></div></div>
<div id="current" class="page"><button class="btn back" onclick="goHome()">← Ana Sayfa</button><div class="title">Cari / Tahsilat</div><div class="card"><label>Müşteri</label><select id="curCustomer" onchange="renderCurrent()"></select><div id="curInfo" class="summary"></div><div class="row"><div><label>Tahsilat ₺</label><input id="payAmount" type="number" step="0.01"></div><div><label>Tarih</label><input id="payDate" type="date"></div></div><button class="btn green" onclick="addPayment()">Tahsilat Ekle</button><div id="payList"></div></div><div class="title">Planlı Tahsilatlar</div><div class="card"><label>Müşteri</label><select id="planCustomer"></select><div class="row"><div><label>Beklenen tutar ₺</label><input id="planAmount" type="number" step="0.01"></div><div><label>Tarih</label><input id="planDate" type="date"></div></div><button class="btn primary" onclick="addPlan()">Plan Ekle</button></div><div id="planList"></div></div>
<div id="profit" class="page"><button class="btn back" onclick="goHome()">← Ana Sayfa</button><div class="title">Günlük Ciro ve Kâr</div><div class="card"><label>Tarih</label><input id="profitDate" type="date" onchange="renderProfit()"><div class="three"><div><b>Ciro</b><div id="revenue"></div></div><div><b>Maliyet</b><div id="cost"></div></div><div><b>Kâr</b><div id="gain"></div></div></div></div><div id="profitList"></div></div>
<div id="regions" class="page"><button class="btn back" onclick="goHome()">← Ana Sayfa</button><div class="title">Bölge Bakiyeleri</div><div id="regionFilters" class="filters"></div><div class="card"><div id="regionTitle"></div><div id="regionTotal" class="summary"></div></div><div id="regionList"></div><div class="title">Bakiye İşlem Geçmişi</div><div id="adjustHistory"></div></div>
</div>
<script>
(function(){
'use strict';
var REGIONS=['Bandırma','Erdek','Gönen','Manyas','Edincik','Avşa Adası','Ocaklar'];
function load(k){try{return JSON.parse(localStorage.getItem(k))||[]}catch(e){return []}}
var musteriler=load('musteriler'),siparisler=load('siparisler'),urunKayitlari=load('urunler'),tahsilatlar=load('tahsilatlar'),planliTahsilatlar=load('planliTahsilatlar');
var bakiyeDuzenlemeleri=load('bakiyeDuzenlemeleri');if(!bakiyeDuzenlemeleri.length){bakiyeDuzenlemeleri=load('bakiyeIslemleri')}
var siparisSepeti=[],duzenlenenSiparis=null,deliveryRegion='Tüm Bölgeler',selectedRegion='Tüm Bölgeler';
function E(id){return document.getElementById(id)}
function save(k,v){localStorage.setItem(k,JSON.stringify(v))}
function n(v){var x=parseFloat(v);return isNaN(x)?0:x}
function money(v){return n(v).toLocaleString('tr-TR',{minimumFractionDigits:2,maximumFractionDigits:2})+' ₺'}
function today(){var d=new Date(),m=('0'+(d.getMonth()+1)).slice(-2),g=('0'+d.getDate()).slice(-2);return d.getFullYear()+'-'+m+'-'+g}
function dateText(s){if(!s)return '-';var a=s.split('-');return a.length===3?a[2]+'.'+a[1]+'.'+a[0]:s}
function tr(s){return String(s||'').toLocaleLowerCase('tr-TR')}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function pages(){var x=document.querySelectorAll('.page');for(var i=0;i<x.length;i++)x[i].style.display='none'}
function show(id){pages();E(id).style.display='block';window.scrollTo(0,0)}
window.goHome=function(){show('home')};
function fillRegions(){E('cRegion').innerHTML=REGIONS.map(function(r){return '<option>'+esc(r)+'</option>'}).join('')}
function customerRegion(name){for(var i=0;i<musteriler.length;i++)if(musteriler[i].ad===name)return musteriler[i].bolge||'';return ''}
function fillCustomers(){var arr=musteriler.slice().sort(function(a,b){return a.ad.localeCompare(b.ad,'tr')});var h=arr.map(function(c){return '<option value="'+esc(c.ad)+'">'+esc(c.ad)+'</option>'}).join('');E('oCustomer').innerHTML=h;E('curCustomer').innerHTML=h;E('planCustomer').innerHTML=h}
function fillProducts(){var arr=urunKayitlari.slice().sort(function(a,b){return a.ad.localeCompare(b.ad,'tr')});E('oProduct').innerHTML='<option value="">Ürün seç</option>'+arr.map(function(p){return '<option value="'+esc(p.ad)+'">'+esc(p.ad)+'</option>'}).join('')}
function sales(name,exclude){var t=0;for(var i=0;i<siparisler.length;i++){var s=siparisler[i];if(s.musteri===name && !(exclude&&s.musteri===exclude.musteri&&s.tarih===exclude.tarih))t+=n(s.adet)*n(s.fiyat)}return t}
function payments(name){var t=0;for(var i=0;i<tahsilatlar.length;i++)if(tahsilatlar[i].musteri===name)t+=n(tahsilatlar[i].tutar);return t}
function adjustments(name){var t=0;for(var i=0;i<bakiyeDuzenlemeleri.length;i++)if(bakiyeDuzenlemeleri[i].musteri===name)t+=n(bakiyeDuzenlemeleri[i].delta);return t}
function balance(name,exclude){return sales(name,exclude)-payments(name)+adjustments(name)}
window.openCustomers=function(){show('customers');listCustomers()};
window.addCustomer=function(){var ad=E('cName').value.trim(),bolge=E('cRegion').value;if(!ad)return alert('Müşteri adını yaz.');for(var i=0;i<musteriler.length;i++)if(tr(musteriler[i].ad)===tr(ad))return alert('Bu müşteri zaten kayıtlı.');musteriler.push({ad:ad,bolge:bolge});save('musteriler',musteriler);E('cName').value='';fillCustomers();listCustomers()};
function listCustomers(){var out='';for(var r=0;r<REGIONS.length;r++){var reg=REGIONS[r],arr=musteriler.filter(function(c){return c.bolge===reg}).sort(function(a,b){return a.ad.localeCompare(b.ad,'tr')});out+='<div class="card"><b>'+esc(reg)+'</b>';if(!arr.length)out+='<div class="muted">Kayıt yok</div>';for(var i=0;i<arr.length;i++){out+='<div class="item"><span>'+esc(arr[i].ad)+'</span><button class="btn small red" style="float:right" data-delcustomer="'+encodeURIComponent(arr[i].ad)+'">Sil</button></div>'}out+='</div>'}E('customerList').innerHTML=out;var bs=E('customerList').querySelectorAll('[data-delcustomer]');for(var j=0;j<bs.length;j++)bs[j].onclick=function(){deleteCustomer(decodeURIComponent(this.getAttribute('data-delcustomer')))}}
function deleteCustomer(name){if(!confirm(name+' silinsin mi?'))return;musteriler=musteriler.filter(function(c){return c.ad!==name});save('musteriler',musteriler);fillCustomers();listCustomers()}
window.openProducts=function(){show('products');listProducts()};
window.addProduct=function(){var ad=E('pName').value.trim();if(!ad)return alert('Ürün adını yaz.');urunKayitlari.push({ad:ad,maliyet:n(E('pCost').value),satis:n(E('pSale').value)});save('urunler',urunKayitlari);E('pName').value='';E('pCost').value='';E('pSale').value='';fillProducts();listProducts()};
window.listProducts=function(){var q=tr(E('pSearch').value),arr=urunKayitlari.slice().filter(function(p){return tr(p.ad).indexOf(q)>=0}).sort(function(a,b){return a.ad.localeCompare(b.ad,'tr')});var h='<div class="card">';if(!arr.length)h+='<div class="muted">Ürün bulunamadı.</div>';for(var i=0;i<arr.length;i++)h+='<div class="item"><b>'+esc(arr[i].ad)+'</b><div class="muted">Maliyet: '+money(arr[i].maliyet)+' · Satış: '+money(arr[i].satis)+'</div><button class="btn small red" data-delproduct="'+i+'" data-name="'+encodeURIComponent(arr[i].ad)+'">Sil</button></div>';h+='</div>';E('productList').innerHTML=h;var bs=E('productList').querySelectorAll('[data-delproduct]');for(var j=0;j<bs.length;j++)bs[j].onclick=function(){deleteProduct(decodeURIComponent(this.getAttribute('data-name')))}}
function deleteProduct(name){if(!confirm(name+' silinsin mi?'))return;urunKayitlari=urunKayitlari.filter(function(p){return p.ad!==name});save('urunler',urunKayitlari);fillProducts();listProducts()}
window.openOrders=function(){show('orders');if(!E('oDate').value)E('oDate').value=today();fillCustomers();fillProducts();renderBasket();listOrders()};
window.fillProductPrice=function(){var name=E('oProduct').value;for(var i=0;i<urunKayitlari.length;i++)if(urunKayitlari[i].ad===name){E('oPrice').value=urunKayitlari[i].satis;break}renderBasket()};
function basketTotal(){var t=0;for(var i=0;i<siparisSepeti.length;i++)t+=n(siparisSepeti[i].adet)*n(siparisSepeti[i].fiyat);return t}
window.orderBalance=function(){var name=E('oCustomer').value;if(!name){E('orderBalanceBox').innerHTML='';return}var base=balance(name,duzenlenenSiparis&&duzenlenenSiparis.musteri===name?duzenlenenSiparis:null),yeni=basketTotal();E('orderBalanceBox').innerHTML='Mevcut Bakiye: <b>'+money(base)+'</b><br>Yeni Sipariş: <b>'+money(yeni)+'</b><br>Sipariş Sonrası: <b>'+money(base+yeni)+'</b>'};
window.addBasket=function(){var urun=E('oProduct').value,adet=n(E('oQty').value),fiyat=n(E('oPrice').value);if(!urun||adet<=0)return alert('Ürün ve adet seç.');var maliyet=0;for(var i=0;i<urunKayitlari.length;i++)if(urunKayitlari[i].ad===urun){maliyet=n(urunKayitlari[i].maliyet);break}siparisSepeti.push({urun:urun,adet:adet,fiyat:fiyat,maliyet:maliyet});E('oProduct').value='';E('oQty').value='1';E('oPrice').value='';renderBasket()};
function renderBasket(){var h='';for(var i=0;i<siparisSepeti.length;i++)h+='<div class="item">'+esc(siparisSepeti[i].urun)+' · '+siparisSepeti[i].adet+' × '+money(siparisSepeti[i].fiyat)+' = <b>'+money(n(siparisSepeti[i].adet)*n(siparisSepeti[i].fiyat))+'</b> <button class="btn small red" data-basket="'+i+'">Sil</button></div>';if(h)h='<div class="card">'+h+'</div>';E('basketList').innerHTML=h;var bs=E('basketList').querySelectorAll('[data-basket]');for(var j=0;j<bs.length;j++)bs[j].onclick=function(){siparisSepeti.splice(parseInt(this.getAttribute('data-basket'),10),1);renderBasket()};window.orderBalance()}
window.saveOrder=function(){var musteri=E('oCustomer').value,tarih=E('oDate').value;if(!musteri||!tarih)return alert('Müşteri ve tarih seç.');if(!siparisSepeti.length){if(E('oProduct').value)window.addBasket();if(!siparisSepeti.length)return alert('Siparişe ürün ekle.')}if(duzenlenenSiparis)siparisler=siparisler.filter(function(s){return !(s.musteri===duzenlenenSiparis.musteri&&s.tarih===duzenlenenSiparis.tarih)});for(var i=0;i<siparisSepeti.length;i++){var x=siparisSepeti[i];siparisler.push({musteri:musteri,tarih:tarih,urun:x.urun,adet:n(x.adet),fiyat:n(x.fiyat),maliyet:n(x.maliyet)})}save('siparisler',siparisler);cancelOrderEdit();listOrders();alert('Sipariş kaydedildi.')};
function groupOrders(){var m={};for(var i=0;i<siparisler.length;i++){var s=siparisler[i],k=s.musteri+'|||'+s.tarih;if(!m[k])m[k]={musteri:s.musteri,tarih:s.tarih,total:0};m[k].total+=n(s.adet)*n(s.fiyat)}var a=[];for(var k in m)if(Object.prototype.hasOwnProperty.call(m,k))a.push(m[k]);a.sort(function(a,b){return b.tarih.localeCompare(a.tarih)||a.musteri.localeCompare(b.musteri,'tr')});return a}
function listOrders(){var a=groupOrders(),h='';for(var i=0;i<a.length;i++)h+='<div class="card"><b>'+esc(a[i].musteri)+'</b><div>'+dateText(a[i].tarih)+' · <span class="money">'+money(a[i].total)+'</span></div><button class="btn small" data-editorder="'+i+'">Düzenle</button> <button class="btn small red" data-delorder="'+i+'">Sil</button></div>';E('orderList').innerHTML=h||'<div class="card muted">Sipariş yok.</div>';var ed=E('orderList').querySelectorAll('[data-editorder]'),de=E('orderList').querySelectorAll('[data-delorder]');for(var j=0;j<ed.length;j++)ed[j].onclick=function(){editOrder(a[parseInt(this.getAttribute('data-editorder'),10)])};for(var z=0;z<de.length;z++)de[z].onclick=function(){deleteOrder(a[parseInt(this.getAttribute('data-delorder'),10)])}}
function editOrder(g){duzenlenenSiparis={musteri:g.musteri,tarih:g.tarih};E('oCustomer').value=g.musteri;E('oDate').value=g.tarih;siparisSepeti=siparisler.filter(function(s){return s.musteri===g.musteri&&s.tarih===g.tarih}).map(function(s){return {urun:s.urun,adet:s.adet,fiyat:s.fiyat,maliyet:lineCost(s)}});E('orderTitle').textContent='Siparişi Düzenle';E('orderSave').textContent='Değişiklikleri Kaydet';E('cancelEdit').style.display='inline-block';renderBasket();window.scrollTo(0,0)}
function deleteOrder(g){if(!confirm(g.musteri+' - '+dateText(g.tarih)+' siparişi silinsin mi?'))return;siparisler=siparisler.filter(function(s){return !(s.musteri===g.musteri&&s.tarih===g.tarih)});save('siparisler',siparisler);listOrders()}
window.cancelOrderEdit=function(){duzenlenenSiparis=null;siparisSepeti=[];E('orderTitle').textContent='Yeni Sipariş';E('orderSave').textContent='Siparişi Kaydet';E('cancelEdit').style.display='none';E('oProduct').value='';E('oQty').value='1';E('oPrice').value='';renderBasket()};
function lineCost(s){if(s.maliyet!==undefined&&s.maliyet!==null)return n(s.maliyet);for(var i=0;i<urunKayitlari.length;i++)if(urunKayitlari[i].ad===s.urun)return n(urunKayitlari[i].maliyet);return 0}
window.openDeliveries=function(){show('deliveries');renderDeliveryFilters();renderDeliveries()};
function renderDeliveryFilters(){var a=['Tüm Bölgeler'].concat(REGIONS),h='';for(var i=0;i<a.length;i++)h+='<button class="btn small '+(a[i]===deliveryRegion?'active':'')+'" data-dregion="'+i+'">'+esc(a[i])+'</button>';E('deliveryFilters').innerHTML=h;var bs=E('deliveryFilters').querySelectorAll('[data-dregion]');for(var j=0;j<bs.length;j++)bs[j].onclick=function(){deliveryRegion=a[parseInt(this.getAttribute('data-dregion'),10)];renderDeliveryFilters();renderDeliveries()}}
function renderDeliveries(){var t=today(),arr=siparisler.filter(function(s){var reg=customerRegion(s.musteri);return s.tarih>=t&&(deliveryRegion==='Tüm Bölgeler'||reg===deliveryRegion)});arr.sort(function(a,b){return a.tarih.localeCompare(b.tarih)||customerRegion(a.musteri).localeCompare(customerRegion(b.musteri),'tr')||a.musteri.localeCompare(b.musteri,'tr')});var total=0,h='',last='';for(var i=0;i<arr.length;i++){var s=arr[i],key=s.tarih+'|'+customerRegion(s.musteri);total+=n(s.adet)*n(s.fiyat);if(key!==last){h+='<div class="card"><b>'+dateText(s.tarih)+' — '+esc(customerRegion(s.musteri)||'Bölgesiz')+'</b>';last=key}h+='<div class="item"><b>'+esc(s.musteri)+'</b><br>'+esc(s.urun)+' · '+s.adet+' × '+money(s.fiyat)+' = '+money(n(s.adet)*n(s.fiyat))+'</div>';var next=arr[i+1];if(!next||next.tarih+'|'+customerRegion(next.musteri)!==key)h+='</div>'}E('deliverySummary').innerHTML='<b>'+arr.length+' ürün satırı</b><br>Toplam: '+money(total);E('deliveryList').innerHTML=h||'<div class="card muted">Bekleyen teslimat yok.</div>'}
window.openCurrent=function(){show('current');fillCustomers();E('payDate').value=today();if(!E('planDate').value)E('planDate').value=today();renderCurrent();renderPlans()};
window.renderCurrent=function(){var name=E('curCustomer').value;if(!name){E('curInfo').innerHTML='Müşteri yok.';E('payList').innerHTML='';return}E('curInfo').innerHTML='Toplam Satış: <b>'+money(sales(name))+'</b><br>Tahsilat: <b>'+money(payments(name))+'</b><br>Manuel Bakiye İşlemleri: <b>'+money(adjustments(name))+'</b><br>Güncel Bakiye: <b>'+money(balance(name))+'</b>';var a=tahsilatlar.filter(function(x){return x.musteri===name}).sort(function(a,b){return b.tarih.localeCompare(a.tarih)}),h='';for(var i=0;i<a.length;i++)h+='<div class="item">'+dateText(a[i].tarih)+' · '+money(a[i].tutar)+'</div>';E('payList').innerHTML=h?'<div class="card">'+h+'</div>':''};
window.addPayment=function(){var name=E('curCustomer').value,t=n(E('payAmount').value),d=E('payDate').value||today();if(!name||t<=0)return alert('Müşteri ve tutar gir.');tahsilatlar.push({musteri:name,tutar:t,tarih:d});save('tahsilatlar',tahsilatlar);E('payAmount').value='';renderCurrent()};
window.addPlan=function(){var name=E('planCustomer').value,t=n(E('planAmount').value),d=E('planDate').value;if(!name||t<=0||!d)return alert('Müşteri, tutar ve tarih gir.');planliTahsilatlar.push({id:String(Date.now())+'_'+String(Math.random()).slice(2),musteri:name,tutar:t,tarih:d,tahsilEdildi:false});save('planliTahsilatlar',planliTahsilatlar);E('planAmount').value='';renderPlans()};
function renderPlans(){var a=planliTahsilatlar.slice().sort(function(a,b){return a.tarih.localeCompare(b.tarih)}),h='';for(var i=0;i<a.length;i++){var p=a[i],status=p.tahsilEdildi?'<span class="ok">Tahsil edildi</span>':(p.tarih<today()?'<span class="danger">Gecikti</span>':'<span class="warn">Bekliyor</span>');h+='<div class="card"><b>'+esc(p.musteri)+'</b><div>'+dateText(p.tarih)+' · '+money(p.tutar)+' · '+status+'</div>';if(!p.tahsilEdildi)h+='<button class="btn small green" data-collect="'+i+'">✅ Tahsil Edildi</button> ';h+='<button class="btn small red" data-delplan="'+i+'">Planı Sil</button></div>'}E('planList').innerHTML=h||'<div class="card muted">Plan yok.</div>';var c=E('planList').querySelectorAll('[data-collect]'),d=E('planList').querySelectorAll('[data-delplan]');for(var j=0;j<c.length;j++)c[j].onclick=function(){collectPlan(a[parseInt(this.getAttribute('data-collect'),10)])};for(var z=0;z<d.length;z++)d[z].onclick=function(){deletePlan(a[parseInt(this.getAttribute('data-delplan'),10)])}}
function planIndex(id){for(var i=0;i<planliTahsilatlar.length;i++)if(planliTahsilatlar[i].id===id)return i;return -1}
function collectPlan(p){var i=planIndex(p.id);if(i<0||planliTahsilatlar[i].tahsilEdildi)return;tahsilatlar.push({musteri:p.musteri,tutar:n(p.tutar),tarih:today(),planId:p.id});planliTahsilatlar[i].tahsilEdildi=true;planliTahsilatlar[i].tahsilTarihi=today();save('tahsilatlar',tahsilatlar);save('planliTahsilatlar',planliTahsilatlar);renderPlans();renderCurrent()}
function deletePlan(p){if(!confirm('Plan silinsin mi?'))return;planliTahsilatlar=planliTahsilatlar.filter(function(x){return x.id!==p.id});save('planliTahsilatlar',planliTahsilatlar);renderPlans()}
window.openProfit=function(){show('profit');E('profitDate').value=today();renderProfit()};
window.renderProfit=function(){var d=E('profitDate').value,arr=siparisler.filter(function(s){return s.tarih===d}),ciro=0,maliyet=0,h='';for(var i=0;i<arr.length;i++){var s=arr[i],sat=n(s.adet)*n(s.fiyat),mal=n(s.adet)*lineCost(s);ciro+=sat;maliyet+=mal;h+='<div class="item"><b>'+esc(s.musteri)+'</b> · '+esc(s.urun)+'<br>'+money(sat)+' · Kâr: '+money(sat-mal)+'</div>'}E('revenue').textContent=money(ciro);E('cost').textContent=money(maliyet);E('gain').textContent=money(ciro-maliyet);E('profitList').innerHTML=h?'<div class="card">'+h+'</div>':'<div class="card muted">Bu tarihte sipariş yok.</div>'};
window.openRegions=function(){show('regions');renderRegionFilters();renderRegions()};
function renderRegionFilters(){var a=['Tüm Bölgeler'].concat(REGIONS),h='';for(var i=0;i<a.length;i++)h+='<button class="btn small '+(a[i]===selectedRegion?'active':'')+'" data-region="'+i+'">'+esc(a[i])+'</button>';E('regionFilters').innerHTML=h;var bs=E('regionFilters').querySelectorAll('[data-region]');for(var j=0;j<bs.length;j++)bs[j].onclick=function(){selectedRegion=a[parseInt(this.getAttribute('data-region'),10)];renderRegionFilters();renderRegions()}}
function renderRegions(){var arr=musteriler.filter(function(c){return selectedRegion==='Tüm Bölgeler'||c.bolge===selectedRegion}).sort(function(a,b){return a.bolge.localeCompare(b.bolge,'tr')||a.ad.localeCompare(b.ad,'tr')}),total=0,h='';for(var i=0;i<arr.length;i++){var b=balance(arr[i].ad);total+=b;h+='<div class="card"><b>'+esc(arr[i].ad)+'</b><div class="muted">'+esc(arr[i].bolge)+'</div><div class="money">'+money(b)+'</div><button class="btn small" data-adjust="'+i+'">✏️ Bakiye İşlemi</button></div>'}E('regionTitle').textContent=selectedRegion;E('regionTotal').innerHTML='Müşteri: <b>'+arr.length+'</b><br>Toplam Bakiye: <b>'+money(total)+'</b>';E('regionList').innerHTML=h||'<div class="card muted">Müşteri yok.</div>';var bs=E('regionList').querySelectorAll('[data-adjust]');for(var j=0;j<bs.length;j++)bs[j].onclick=function(){balanceAction(arr[parseInt(this.getAttribute('data-adjust'),10)].ad)};renderAdjustmentHistory()}
function balanceAction(name){var sec=prompt(name+'\n1 = Borç Ekle\n2 = Borç Düş\n3 = Bakiyeyi Elle Belirle');if(sec!=='1'&&sec!=='2'&&sec!=='3')return;var val=n(prompt(sec==='3'?'Yeni bakiye tutarı:':'Tutar:'));if(val<0)return alert('Tutar negatif olamaz.');var current=balance(name),delta=sec==='1'?val:(sec==='2'?-val:val-current),type=sec==='1'?'Borç Ekle':(sec==='2'?'Borç Düş':'Bakiyeyi Elle Belirle'),note=prompt('Not (isteğe bağlı):')||'';bakiyeDuzenlemeleri.push({musteri:name,delta:delta,islem:type,hedef:sec==='3'?val:null,not:note,tarih:today(),zaman:new Date().toLocaleString('tr-TR')});save('bakiyeDuzenlemeleri',bakiyeDuzenlemeleri);renderRegions()}
function renderAdjustmentHistory(){var a=bakiyeDuzenlemeleri.slice().reverse(),h='';for(var i=0;i<a.length;i++){var x=a[i];if(selectedRegion!=='Tüm Bölgeler'&&customerRegion(x.musteri)!==selectedRegion)continue;h+='<div class="card"><b>'+esc(x.musteri)+'</b> · '+esc(x.islem||'Bakiye İşlemi')+'<div>'+((n(x.delta)>=0)?'+':'')+money(x.delta)+' · '+esc(x.zaman||dateText(x.tarih))+'</div>'+(x.not?'<div class="muted">'+esc(x.not)+'</div>':'')+'</div>'}E('adjustHistory').innerHTML=h||'<div class="card muted">İşlem geçmişi yok.</div>'}
fillRegions();fillCustomers();fillProducts();E('oDate').value=today();E('payDate').value=today();E('planDate').value=today();E('profitDate').value=today();show('home');
})();
</script></body></html>
