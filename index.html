<script>
(function(){
'use strict';
var REGIONS=['Band\u0131rma','Erdek','G\u00f6nen','Manyas','Edincik','Av\u015fa Adas\u0131','Ocaklar'];
function load(k){try{return JSON.parse(localStorage.getItem(k))||[]}catch(e){return []}}
var musteriler=load('musteriler'),siparisler=load('siparisler'),urunKayitlari=load('urunler'),tahsilatlar=load('tahsilatlar'),planliTahsilatlar=load('planliTahsilatlar');
var bakiyeDuzenlemeleri=load('bakiyeDuzenlemeleri');if(!bakiyeDuzenlemeleri.length){bakiyeDuzenlemeleri=load('bakiyeIslemleri')}
var siparisSepeti=[],duzenlenenSiparis=null,deliveryRegion='T\u00fcm B\u00f6lgeler',deliveryMode='pending',selectedRegion='T\u00fcm B\u00f6lgeler';
function E(id){return document.getElementById(id)}
var SUPA_URL='https://llwvqmppcgqnsdhfnwpv.supabase.co/rest/v1';
var SUPA_KEY='sb_publishable_qNblclW696Ys8YTfsIDclQ_z7J5eq3C';
var cloudReady=false,syncTimer=null;
function save(k,v){localStorage.setItem(k,JSON.stringify(v));if(cloudReady){clearTimeout(syncTimer);syncTimer=setTimeout(syncAllToCloud,350)}}
function api(path,opt){opt=opt||{};opt.headers=opt.headers||{};opt.headers.apikey=SUPA_KEY;opt.headers.Authorization='Bearer '+SUPA_KEY;if(opt.body){opt.headers['Content-Type']='application/json';opt.headers.Prefer='return=minimal'}return fetch(SUPA_URL+path,opt).then(function(r){if(!r.ok)return r.text().then(function(t){throw new Error(t||('HTTP '+r.status))});return r.status===204?null:r.text().then(function(t){return t?JSON.parse(t):null})})}
function rowsFor(k){var a=[],i,x;if(k==='musteriler'){for(i=0;i<musteriler.length;i++)a.push({ad:musteriler[i].ad,bolge:musteriler[i].bolge||''})}
else if(k==='urunler'){for(i=0;i<urunKayitlari.length;i++)a.push({ad:urunKayitlari[i].ad,birim:urunKayitlari[i].birim||'Adet',maliyet:n(urunKayitlari[i].maliyet),satis:n(urunKayitlari[i].satis)})}
else if(k==='siparisler'){for(i=0;i<siparisler.length;i++){x=siparisler[i];a.push({musteri:x.musteri,tarih:x.tarih,urun:x.urun||'',aciklama:x.not||'',birim:x.birim||'Adet',adet:n(x.adet),fiyat:n(x.fiyat),maliyet:n(x.maliyet),teslim_edildi:!!x.teslimEdildi,teslim_tarihi:x.teslimTarihi?x.teslimTarihi+'T12:00:00Z':null,gecmisten_silindi:!!x.teslimGecmisSilindi})}}
else if(k==='tahsilatlar'){for(i=0;i<tahsilatlar.length;i++){x=tahsilatlar[i];a.push({musteri:x.musteri,tutar:n(x.tutar),tarih:x.tarih||null})}}
else if(k==='planli_tahsilatlar'){for(i=0;i<planliTahsilatlar.length;i++){x=planliTahsilatlar[i];a.push({musteri:x.musteri,tutar:n(x.tutar),tarih:x.tarih||null,durum:x.tahsilEdildi?'tahsil_edildi':'bekliyor'})}}
else if(k==='bakiye_duzenlemeleri'){for(i=0;i<bakiyeDuzenlemeleri.length;i++){x=bakiyeDuzenlemeleri[i];a.push({musteri:x.musteri,tutar:n(x.delta),aciklama:(x.islem||'Bakiye \u0130\u015flemi')+(x.not?' - '+x.not:''),tarih:x.tarih||today()})}}return a}
function replaceTable(table,rows){return api('/'+table+'?id=gt.0',{method:'DELETE'}).then(function(){if(!rows.length)return null;return api('/'+table,{method:'POST',body:JSON.stringify(rows)})})}
function syncAllToCloud(){var jobs=[['musteriler','musteriler'],['urunler','urunler'],['siparisler','siparisler'],['tahsilatlar','tahsilatlar'],['planli_tahsilatlar','planli_tahsilatlar'],['bakiye_duzenlemeleri','bakiye_duzenlemeleri']];var chain=Promise.resolve();for(var i=0;i<jobs.length;i++)(function(j){chain=chain.then(function(){return replaceTable(j[1],rowsFor(j[0]))})})(jobs[i]);return chain.catch(function(e){console.error('Supabase senkronizasyon hatas\u0131',e)})}
function strictReplaceTable(table,rows){
 return api('/'+table+'?id=gt.0',{method:'DELETE'}).catch(function(e){throw new Error(table+' / temizleme: '+e.message)}).then(function(){
  if(!rows.length)return null;
  return api('/'+table,{method:'POST',body:JSON.stringify(rows)}).catch(function(e){throw new Error(table+' / kaydetme: '+e.message)});
 });
}
function strictSyncAllToCloud(){
 var jobs=[['musteriler','musteriler'],['urunler','urunler'],['siparisler','siparisler'],['tahsilatlar','tahsilatlar'],['planli_tahsilatlar','planli_tahsilatlar'],['bakiye_duzenlemeleri','bakiye_duzenlemeleri']];
 var chain=Promise.resolve();
 for(var i=0;i<jobs.length;i++)(function(j){chain=chain.then(function(){return strictReplaceTable(j[1],rowsFor(j[0]))})})(jobs[i]);
 return chain;
}
window.uploadLocalToCloud=function(){
 var total=musteriler.length+urunKayitlari.length+siparisler.length+tahsilatlar.length+planliTahsilatlar.length+bakiyeDuzenlemeleri.length;
 if(!total)return alert('Telefonda aktar\u0131lacak kay\u0131t bulunamad\u0131.');
 if(!confirm('Telefondaki '+total+' kay\u0131t Supabase bulutuna aktar\u0131lacak. Devam edilsin mi?'))return;
 var b=E('cloudUploadBtn');if(b){b.disabled=true;b.textContent='\u2601\ufe0f Aktar\u0131l\u0131yor...'}
 strictSyncAllToCloud().then(function(){
  return Promise.all([getTable('musteriler'),getTable('urunler'),getTable('siparisler'),getTable('tahsilatlar'),getTable('planli_tahsilatlar'),getTable('bakiye_duzenlemeleri')]);
 }).then(function(d){
  var expected=[musteriler.length,urunKayitlari.length,siparisler.length,tahsilatlar.length,planliTahsilatlar.length,bakiyeDuzenlemeleri.length];
  var names=['musteriler','urunler','siparisler','tahsilatlar','planli_tahsilatlar','bakiye_duzenlemeleri'];
  for(var i=0;i<d.length;i++)if((d[i]||[]).length!==expected[i])throw new Error(names[i]+' / do\u011frulama: beklenen '+expected[i]+', bulutta '+(d[i]||[]).length);
  localStorage.setItem('umutCloudMigrated','1');cloudReady=true;
  if(b){b.textContent='\u2705 Buluta Aktar\u0131ld\u0131';b.disabled=true}
  alert('TAMAMLANDI \u2705\n\nT\u00fcm kay\u0131tlar Supabase bulutuna aktar\u0131ld\u0131 ve do\u011fruland\u0131.');
 }).catch(function(e){
  console.error(e);if(b){b.disabled=false;b.textContent='\u2601\ufe0f Buluta Aktar'}
  alert('AKTARIM HATASI\n\n'+e.message+'\n\nTelefon kay\u0131tlar\u0131 silinmedi. Bu mesaj\u0131n ekran g\u00f6r\u00fcnt\u00fcs\u00fcn\u00fc g\u00f6nder.');
 });
};
function getTable(t){return api('/'+t+'?select=*&order=id.asc')}
function cloudLoad(){return Promise.all([getTable('musteriler'),getTable('urunler'),getTable('siparisler'),getTable('tahsilatlar'),getTable('planli_tahsilatlar'),getTable('bakiye_duzenlemeleri')]).then(function(d){var count=0,i,x;for(i=0;i<d.length;i++)count+=(d[i]||[]).length;if(!count){cloudReady=true;return syncAllToCloud()}musteriler=(d[0]||[]).map(function(x){return{ad:x.ad,bolge:x.bolge||''}});urunKayitlari=(d[1]||[]).map(function(x){return{ad:x.ad,birim:x.birim||'Adet',maliyet:n(x.maliyet),satis:n(x.satis)}});siparisler=(d[2]||[]).map(function(x){return{musteri:x.musteri,tarih:x.tarih,urun:x.urun,not:x.aciklama||'',birim:x.birim||'Adet',adet:n(x.adet),fiyat:n(x.fiyat),maliyet:n(x.maliyet),diger:!!x.aciklama,teslimEdildi:!!x.teslim_edildi,teslimTarihi:x.teslim_tarihi?String(x.teslim_tarihi).slice(0,10):null,teslimGecmisSilindi:!!x.gecmisten_silindi}});tahsilatlar=(d[3]||[]).map(function(x){return{musteri:x.musteri,tutar:n(x.tutar),tarih:x.tarih}});planliTahsilatlar=(d[4]||[]).map(function(x){return{id:'db_'+x.id,musteri:x.musteri,tutar:n(x.tutar),tarih:x.tarih,tahsilEdildi:x.durum==='tahsil_edildi'}});bakiyeDuzenlemeleri=(d[5]||[]).map(function(x){return{musteri:x.musteri,delta:n(x.tutar),islem:x.aciklama||'Bakiye \u0130\u015flemi',not:'',tarih:x.tarih}});localStorage.setItem('musteriler',JSON.stringify(musteriler));localStorage.setItem('urunler',JSON.stringify(urunKayitlari));localStorage.setItem('siparisler',JSON.stringify(siparisler));localStorage.setItem('tahsilatlar',JSON.stringify(tahsilatlar));localStorage.setItem('planliTahsilatlar',JSON.stringify(planliTahsilatlar));localStorage.setItem('bakiyeDuzenlemeleri',JSON.stringify(bakiyeDuzenlemeleri));cloudReady=true}).catch(function(e){console.error('Supabase ba\u011flant\u0131s\u0131 kurulamad\u0131',e);cloudReady=false})}
function n(v){var x=parseFloat(v);return isNaN(x)?0:x}
function money(v){return n(v).toLocaleString('tr-TR',{minimumFractionDigits:2,maximumFractionDigits:2})+' \u20ba'}
function today(){var d=new Date(),m=('0'+(d.getMonth()+1)).slice(-2),g=('0'+d.getDate()).slice(-2);return d.getFullYear()+'-'+m+'-'+g}
function dateText(s){if(!s)return '-';var a=s.split('-');return a.length===3?a[2]+'.'+a[1]+'.'+a[0]:s}
function weekday(s){if(!s)return '';var a=s.split('-');if(a.length!==3)return '';var d=new Date(Number(a[0]),Number(a[1])-1,Number(a[2]));var gunler=['Pazar','Pazartesi','Sal\u0131','\u00c7ar\u015famba','Per\u015fembe','Cuma','Cumartesi'];return gunler[d.getDay()]}
function dateWithDay(s){return dateText(s)+' \u2014 '+weekday(s)}
function unitOfProduct(name){for(var i=0;i<urunKayitlari.length;i++)if(urunKayitlari[i].ad===name)return urunKayitlari[i].birim||'Adet';return 'Adet'}
function lineUnit(s){return s.birim||unitOfProduct(s.urun)||'Adet'}
function tr(s){return String(s||'').toLocaleLowerCase('tr-TR')}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function pages(){var x=document.querySelectorAll('.page');for(var i=0;i<x.length;i++)x[i].style.display='none'}
function show(id){pages();E(id).style.display='block';window.scrollTo(0,0)}
window.goHome=function(){show('home')};
function fillRegions(){E('cRegion').innerHTML=REGIONS.map(function(r){return '<option>'+esc(r)+'</option>'}).join('')}
function customerRegion(name){for(var i=0;i<musteriler.length;i++)if(musteriler[i].ad===name)return musteriler[i].bolge||'';return ''}
function fillCustomers(){var arr=musteriler.slice().sort(function(a,b){return a.ad.localeCompare(b.ad,'tr')});var h=arr.map(function(c){return '<option value="'+esc(c.ad)+'">'+esc(c.ad)+'</option>'}).join('');E('oCustomer').innerHTML=h;E('curCustomer').innerHTML=h;E('planCustomer').innerHTML=h}
function fillProducts(){var arr=urunKayitlari.slice().sort(function(a,b){return a.ad.localeCompare(b.ad,'tr')});E('oProduct').innerHTML='<option value="">\u00dcr\u00fcn se\u00e7</option>'+arr.map(function(p){return '<option value="'+esc(p.ad)+'">'+esc(p.ad)+'</option>'}).join('')+'<option value="__OTHER__">Di\u011fer</option>'}
function sales(name,exclude){var t=0;for(var i=0;i<siparisler.length;i++){var s=siparisler[i];if(s.musteri===name && !(exclude&&s.musteri===exclude.musteri&&s.tarih===exclude.tarih))t+=n(s.adet)*n(s.fiyat)}return t}
function payments(name){var t=0;for(var i=0;i<tahsilatlar.length;i++)if(tahsilatlar[i].musteri===name)t+=n(tahsilatlar[i].tutar);return t}
function adjustments(name){var t=0;for(var i=0;i<bakiyeDuzenlemeleri.length;i++)if(bakiyeDuzenlemeleri[i].musteri===name)t+=n(bakiyeDuzenlemeleri[i].delta);return t}
function balance(name,exclude){return sales(name,exclude)-payments(name)+adjustments(name)}
window.openCustomers=function(){show('customers');setTimeout(listCustomers,0)};
window.addCustomer=function(){var ad=E('cName').value.trim(),bolge=E('cRegion').value;if(!ad)return alert('M\u00fc\u015fteri ad\u0131n\u0131 yaz.');for(var i=0;i<musteriler.length;i++)if(tr(musteriler[i].ad)===tr(ad))return alert('Bu m\u00fc\u015fteri zaten kay\u0131tl\u0131.');musteriler.push({ad:ad,bolge:bolge});save('musteriler',musteriler);E('cName').value='';fillCustomers();listCustomers()};
function listCustomers(){var out='';for(var r=0;r<REGIONS.length;r++){var reg=REGIONS[r],arr=musteriler.filter(function(c){return c.bolge===reg}).sort(function(a,b){return a.ad.localeCompare(b.ad,'tr')});out+='<div class="card"><b>'+esc(reg)+'</b>';if(!arr.length)out+='<div class="muted">Kay\u0131t yok</div>';for(var i=0;i<arr.length;i++){out+='<div class="item"><span>'+esc(arr[i].ad)+'</span><button class="btn small red" style="float:right" data-delcustomer="'+encodeURIComponent(arr[i].ad)+'">Sil</button></div>'}out+='</div>'}E('customerList').innerHTML=out;var bs=E('customerList').querySelectorAll('[data-delcustomer]');for(var j=0;j<bs.length;j++)bs[j].onclick=function(){deleteCustomer(decodeURIComponent(this.getAttribute('data-delcustomer')))}}
function deleteCustomer(name){if(!confirm(name+' silinsin mi?'))return;musteriler=musteriler.filter(function(c){return c.ad!==name});save('musteriler',musteriler);fillCustomers();listCustomers()}
